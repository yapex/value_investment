[project]
name = "value-investment-skill"
version = "0.1.0"
description = "A value investment analysis tool for A股/港股/美股"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.25",
    "dependency-injector>=4.48.3",
    "diskcache>=5.6.3",
    "typer>=0.23.1",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_investment"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
