[project]
name = "value-investment"
version = "0.2.0"
description = "A value investment analysis tool for A股/港股/美股"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.25",
    "dependency-injector>=4.48.3",
    "diskcache>=5.6.3",
    "typer>=0.23.1",
    "pandas>=2.0.0",
]

[project.scripts]
v-invest = "value_investment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_investment"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "poethepoet>=0.30.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.poe.tasks.to_nanobot]
help = "Copy SKILL.md to nanobot skills directory"
shell = "mkdir -p ~/.nanobot/workspace/skills/value_investment && cp SKILL.md ~/.nanobot/workspace/skills/value_investment/"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["node_modules", ".venv"]
pythonPath = ".venv/bin/python"
pythonVersion = "3.11"
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Only basic errors, no style checks for now
select = ["E", "F", "UP"]
ignore = ["E501", "E722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
