[project]
name = "value-investment"
version = "0.1.0"
description = "A value investment analysis tool for A股/港股/美股"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.25",
    "dependency-injector>=4.48.3",
    "diskcache>=5.6.3",
    "typer>=0.23.1",
    "pandas>=2.0.0",
]

[project.scripts]
v-invest = "value_investment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_investment"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "poethepoet>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poe.tasks.skill]
help = "Copy skill files to dist/v-invest/"
shell = """
rm -rf dist/v-invest
mkdir -p dist/v-invest
cp SKILL.MD dist/v-invest/
cp -r references dist/v-invest/
"""

[tool.poe.tasks.to_nanobot]
help = "Deploy skill to ~/.nanobot/workspace/skills/"
deps = ["skill"]
shell = """
rm -rf ~/.nanobot/workspace/skills/v-invest
cp -r dist/v-invest ~/.nanobot/workspace/skills/
"""
