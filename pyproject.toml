[project]
name = "value-investment"
version = "0.2.0"
description = "A value investment analysis tool for A股/港股/美股"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.25",
    "diskcache>=5.6.3",
    "typer>=0.23.1",
    "pandas>=2.0.0,<3.0.0",  # tushare pro_bar 使用 fillna(method='bfill')，pandas 3.0 不兼容
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "tushare>=1.4.25",
    "yfinance>=1.2.0",
    "pytest-dotenv>=0.5.2",
    "dependency-injector>=4.48.3",
    "tabulate>=0.9.0",  # DataFrame.to_markdown() 需要
    "matplotlib>=3.10.8",
]

[project.scripts]
v-invest = "value_investment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_investment"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "poethepoet>=0.30.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
    "pytest-dotenv>=0.5.2",
]

[tool.poe.tasks.to_nanobot]
help = "Copy SKILL.md to nanobot skills directory"
shell = "mkdir -p ~/.nanobot/workspace/skills/value_investment && cp SKILL.md ~/.nanobot/workspace/skills/value_investment/"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
env_files = [".env"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["node_modules", ".venv"]
pythonPath = ".venv/bin/python"
pythonVersion = "3.11"
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Only basic errors, no style checks for now
select = ["E", "F", "UP"]
ignore = ["E501", "E722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["src/value_investment"]
# Exclude complex valuation indicators that require real market data for testing
# These use DCF models and require historical prices, financial data, etc.
omit = [
    "*/tests/*",
    "*/indicators/valuation.py",
]

[tool.coverage.report]
# Target is 78% for main code (excluding valuation module which requires external data)
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
